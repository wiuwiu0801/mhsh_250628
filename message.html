<!DOCTYPE html>
<html>
<head>
<meta charset="EUC-KR">
<title>축하의 말</title>
<style type="text/css">
#t1, div {
  border: 1px solid white;
}

@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

.gowun-batang-regular {
  font-family: "Gowun Batang", serif;
  font-weight: 400;
  font-style: normal;
}

.gowun-batang-bold {
  font-family: "Gowun Batang", serif;
  font-weight: 700;
  font-style: normal;
}
</style>
<script>
  let cnt = 1;

  // 페이지 로드 시 기존 데이터 불러오기
  window.onload = function() {
    let savedMessages = JSON.parse(localStorage.getItem('messages')) || [];
    savedMessages.forEach((msg) => {
      let el = mkDiv(msg.writer, msg.pwd, msg.content);
      document.getElementById("list").appendChild(el);
    });
    cnt = savedMessages.length + 1;  // 새로 추가할 메시지의 cnt 값 설정
  }

  function a() {
    let writer = f.writer.value;
    let pwd = f.pwd.value;
    let content = f.content.value;
    let el = mkDiv(writer, pwd, content);
    let list = document.getElementById("list");
    list.appendChild(el);

    // 작성한 내용 저장
    saveMessage(writer, pwd, content);

    f.writer.value = "";
    f.pwd.value = "";
    f.content.value = "";
  }

  function mkDiv(writer, pwd, content) {
    let newDiv = document.createElement("div");
    newDiv.id = "d_" + cnt;
    newDiv.pwd = pwd;
    let html = "";
    html += "<font color='pink' class='gowun-batang-bold' line-height='200%'>작성자:</font><span id='w_" + cnt + "'>" + writer + "</span><br/>";
    html += "<font color='pink' class='gowun-batang-bold' line-height='200%'>♥:</font><span id='c_" + cnt + "'>" + content + "</span><br/>";
    html += "<input type='button' value='수정' onclick='editForm(" + cnt + ")' style='background-color:pink; border:none; color:white; border-radius:20px; float: right;'>";
    html += "<input type='button' value='삭제' onclick='del(" + cnt + ")' style='background-color:pink; border:none; color:white; border-radius:20px; float: right; margin-right: 5px;'>";
    newDiv.innerHTML = html;
    cnt++;
    return newDiv;
  }

  function saveMessage(writer, pwd, content) {
    let savedMessages = JSON.parse(localStorage.getItem('messages')) || [];
    savedMessages.push({ writer, pwd, content });
    localStorage.setItem('messages', JSON.stringify(savedMessages));
  }

  function editForm(cnt) {
    let editDiv = document.getElementById("d_" + cnt);
    let editForm = document.getElementById("editf");
    editDiv.appendChild(editForm);
    let writer = document.getElementById("w_" + cnt).innerHTML;
    let content = document.getElementById("c_" + cnt).innerHTML;
    document.getElementById("editwriter").value = writer;
    document.getElementById("editcontent").value = content;
    document.getElementById("editbtn").cnt = cnt;
    editForm.style.display = '';
  }

  function cancel() {
    let editForm = document.getElementById("editf");
    editForm.style.display = 'none';
    document.getElementsByTagName("body")[0].appendChild(editForm);
  }

  function edit() {
    let cnt = document.getElementById("editbtn").cnt;
    let editDiv = document.getElementById("d_" + cnt);
    let pwd2 = document.getElementById("editpwd").value;
    if (editDiv.pwd != pwd2) {
      alert("글 비밀번호 불일치. 수정불가");
    } else {
      let newWriter = document.getElementById("editwriter").value;
      let newContent = document.getElementById("editcontent").value;
      document.getElementById("w_" + cnt).innerHTML = newWriter;
      document.getElementById("c_" + cnt).innerHTML = newContent;
      updateMessage(cnt, newWriter, newContent);
    }
    document.getElementById("editwriter").value = "";
    document.getElementById("editcontent").value = "";
    document.getElementById("editpwd").value = "";
    cancel();
  }

  function updateMessage(cnt, newWriter, newContent) {
    let savedMessages = JSON.parse(localStorage.getItem('messages')) || [];
    savedMessages[cnt - 1] = { writer: newWriter, pwd: savedMessages[cnt - 1].pwd, content: newContent };
    localStorage.setItem('messages', JSON.stringify(savedMessages));
  }

  function del(cnt) {
    let pwd = prompt("글 비밀번호");
    let delDiv = document.getElementById("d_" + cnt);
    if (pwd == delDiv.pwd) {
      document.getElementById("list").removeChild(delDiv);
      deleteMessage(cnt);
    } else {
      alert("글 비밀번호 불일치. 삭제취소");
    }
  }

  function deleteMessage(cnt) {
    let savedMessages = JSON.parse(localStorage.getItem('messages')) || [];
    savedMessages.splice(cnt - 1, 1); // 해당 메시지 삭제
    localStorage.setItem('messages', JSON.stringify(savedMessages));
  }
</script>
</head>
<body>

  <form name="f">
    <table id="t1">
      <tr>
        <th style="color:pink;" class="gowun-batang-bold">작성자</th>
        <td><input type="text" name="writer" id="writer" style="width:200px;"></td>
      </tr>
      <tr>
        <th style="color:pink;" class="gowun-batang-bold">글 비밀번호</th>
        <td><input type="password" name="pwd" id="pwd" style="width:200px;"></td>
      </tr>
      <tr>
        <th style="color:pink;" class="gowun-batang-bold">내용</th>
        <td><input type="text" name="content" id="content" style="width:200px; height:50px;"></td>
      </tr>
      <tr>
        <th style="color:white;">작성</th>
        <td><input type="button" value="작성" onclick="a()" style="background-color:pink; border:none; color:white; border-radius:20px;"></td>
      </tr>
    </table>
  </form>

  <div id="list"></div>

  <!-- 수정폼 -->
  <table id="editf" style="display: none;">
    <tr>
      <th style="color:pink;" class="gowun-batang-bold">작성자</th>
      <td><input type="text" name="editwriter" id="editwriter" style="width:200px;"></td>
    </tr>
    <tr>
      <th style="color:pink;" class="gowun-batang-bold">글 비밀번호</th>
      <td><input type="password" name="editpwd" id="editpwd" style="width:200px;"></td>
    </tr>
    <tr>
      <th style="color:pink;" class="gowun-batang-bold">내용</th>
      <td><input type="text" name="editcontent" id="editcontent" style="width:200px; height:50px;"></td>
    </tr>
    <tr>
      <th style="color:pink;" class="gowun-batang-bold">수정완료</th>
      <td>
        <input type="button" value="수정완료" id="editbtn" onclick="edit()" style="background-color:pink; border:none; color:white; border-radius:20px;">
        <input type="button" value="취소" onclick="cancel()" style="background-color:pink; border:none; color:white; border-radius:20px;">
      </td>
    </tr>
  </table>

</body>
</html>
