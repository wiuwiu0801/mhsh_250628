<!DOCTYPE html>
<html lang="en">
<head>
  <style>

    /* 고덕바탕 폰트 임포트 */
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

    /* 모든 텍스트에 고덕바탕 폰트 적용 */
    body {
      font-family: 'Gowun Batang', serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    /* 컨테이너를 중앙 정렬하기 위해 Flexbox 사용 */
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* 버튼 스타일 */
    button {
      font-size: 300%;
      background-color: pink;
      border: none;
      color: white;
      border-radius: 20px;
      padding: 15px 30px;
      cursor: pointer;
      margin-top: 20px;
    }

    /* 텍스트 입력 필드 */
    #copyTxt {
      font-size: 100%;
      color: white;
      border: 1px solid white;
      background-color: white;
      text-align: center;
      padding: 10px;
      margin-top: 10px;
    }

    /* 행간을 줄이기 위한 스타일 */
    p {
      line-height: 1.2; /* 행간을 좁게 설정 */
      margin: 0; /* p 태그의 기본 마진을 제거 */
    }
  </style>
</head>
<body>

  <div class="container">
    <p style="font-size:300%">신랑 이상효</p>

    <br>
    <input type="text" value="농협 3120098188621" id="copyTxt"> 
    <br>
    <button onclick="copy()">계좌번호 복사하기</button>
  </div>

  <script>
    function copy() {
      var copyTxt = document.getElementById("copyTxt");

      // 입력 필드 선택
      copyTxt.select();
      copyTxt.setSelectionRange(0, 99999); // 모바일에서도 작동하도록 설정

      // 클립보드에 텍스트 복사
      navigator.clipboard.writeText(copyTxt.value);

      // 복사 완료 알림
      alert("복사되었습니다.");
    }
  </script>

</body>
</html>
