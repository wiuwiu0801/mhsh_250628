<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 고덕바탕 폰트 임포트 */
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

    /* 모든 텍스트에 고덕바탕 폰트 적용 */
    body {
      font-family: 'Gowun Batang', serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    /* 컨테이너를 중앙 정렬하기 위해 Flexbox 사용 */
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* 버튼 컨테이너 */
    .button-container {
      display: flex; /* 버튼들을 가로로 정렬 */
      gap: 20px; /* 버튼 사이에 간격을 줌 */
    }

    /* 버튼 스타일 */
    button {
      font-size: 150%;
      background-color: pink;
      border: none;
      color: white;
      border-radius: 20px;
      padding: 15px 30px;
      cursor: pointer;
      white-space: nowrap; /* 텍스트가 한 줄로 표시되지 않도록 설정 */
    }

    /* 텍스트 입력 필드 */
    #copyTxt {
      font-size: 100%;
      color: white;
      border: 1px solid white;
      background-color: white;
      text-align: center;
      padding: 10px;
      margin-top: 10px;
    }

    /* 행간을 줄이기 위한 스타일 */
    p {
      line-height: 1.2; /* 행간을 좁게 설정 */
      margin: 0; /* p 태그의 기본 마진을 제거 */
    }

    /* 신부 아버지에 파스텔옐로우 형광펜 효과 적용 */
    .highlight {
      background-color: #FFF2CC; /* 파스텔 옐로우 */
      padding: 0 5px; /* 글자 주변에 여백을 추가하여 형광펜 느낌 */
    }
  </style>
</head>
<body>

  <div class="container">

    <br>
    
    <p style="font-size:100%" class="highlight">신부 아버지</p> <!-- 여기에서 클래스를 추가 -->
    <p style="font-size:300%">전창식</p>

    <br>
    <input type="text" value="국민은행" id="copyTxt"> 
    <br>

    <!-- 버튼들을 가로로 배치하는 컨테이너 추가 -->
    <div class="button-container">
      <!-- 전화 연결을 위한 a 태그 사용 -->
      <a href="tel:01029355295">
        <button>연락 하기</button>
      </a>

      <button onclick="copy()">계좌번호 복사하기</button> <!-- 줄바꿈 추가 -->

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSe7pldTAdUSHT7Yp3hUi36XaEr8vCWaC9So53EcFt73v6SxMw/viewform">
        <button>축하의 말 적기</button> <!-- 줄바꿈 추가 -->
      </a>
  
     <br>   

        <p style="font-size:100%" class="highlight">신부 어머니</p> <!-- 여기에서 클래스를 추가 -->
    <p style="font-size:300%">김미혜</p>

    <br>
    <input type="text" value="국민은행" id="copyTxt"> 
    <br>

    <!-- 버튼들을 가로로 배치하는 컨테이너 추가 -->
    <div class="button-container">
      <!-- 전화 연결을 위한 a 태그 사용 -->
      <a href="tel:01029355295">
        <button>연락 하기</button>
      </a>

      <button onclick="copy()">계좌번호<br>복사하기</button> <!-- 줄바꿈 추가 -->

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSe7pldTAdUSHT7Yp3hUi36XaEr8vCWaC9So53EcFt73v6SxMw/viewform">
        <button>축하의 말<br>적기</button> <!-- 줄바꿈 추가 -->
        
      </a>
    </div>
  </div>

  <script>
    function copy() {
      var copyTxt = document.getElementById("copyTxt");

      // 입력 필드 선택
      copyTxt.select();
      copyTxt.setSelectionRange(0, 99999); // 모바일에서도 작동하도록 설정

      // 클립보드에 텍스트 복사
      navigator.clipboard.writeText(copyTxt.value);

      // 복사 완료 알림
      alert("복사되었습니다.");
    }
  </script>

</body>
</html>
