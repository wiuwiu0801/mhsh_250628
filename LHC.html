<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    p {
      text-align: center;
    }
  </style>
</head>
<body>

  <p style="font-size:300%">신랑 아버지 이희철</p>
  <p style="font-size:300%">(신랑 어머니 김명숙)</p>

  <br>
  <input type="text" value="농협 60114352021090" id="copyTxt" style="font-size:100%; color:white; border:none;"> 
  <br>
  <button onclick="copy()" style="font-size:100%; background-color:pink; border:none; color:white; border-radius:20px;">
    계좌번호 복사하기
  </button>

  <script>
    function copy() {
      var copyTxt = document.getElementById("copyTxt");

      // 입력 필드 선택
      copyTxt.select();
      copyTxt.setSelectionRange(0, 99999); // 모바일에서도 작동하도록 설정

      // 클립보드에 텍스트 복사
      navigator.clipboard.writeText(copyTxt.value);

      // 복사 완료 알림
      alert("복사되었습니다.");
    }
  </script>

</body>
</html>
